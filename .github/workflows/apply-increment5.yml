name: apply-increment5

on:
  push:
    branches: [probe-common-controls-v6]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fix exact manifest quoting
        run: python tools/fix_increment5_manifest.py
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/probe/probe_hooks.cpp
          git commit -m 'fix(probe): preserve v6 manifest quoting'
          git push origin HEAD:probe-common-controls-v6
