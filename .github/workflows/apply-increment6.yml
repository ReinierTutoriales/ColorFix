name: apply-increment6

on:
  push:
    branches: [probe-uxtheme-observe]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply increment 6 probe edits
        run: python tools/apply_increment6.py
      - name: Commit probe edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/probe/probe_hooks.cpp
          git commit -m 'test(probe): observe UxTheme passively'
          git push origin HEAD:probe-uxtheme-observe
