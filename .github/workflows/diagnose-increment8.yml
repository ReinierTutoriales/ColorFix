name: diagnose-increment8

on:
  push:
    branches: [increment8-runtime-policy]
    paths:
      - tools/increment8-diagnose.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply diagnostic patch
        run: python tools/diagnose_increment8_v2.py
      - name: Push patch commit
        run: git push origin HEAD:increment8-runtime-policy
