name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, vcarch: amd64, preset: x64 }
          - { runner: windows-latest, vcarch: amd64_x86, preset: x86 }
          - { runner: windows-11-arm, vcarch: arm64, preset: arm64 }
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcarch }}
      - name: Toolchain
        shell: pwsh
        run: |
          cl 2>&1 | Select-Object -First 1
          cmake --version
          ninja --version
          python --version
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Backend smoke (MinHook-Detours)
        run: build\\${{ matrix.preset }}\\mhd_smoke.exe
      - name: Probe increment 0 (capture infrastructure)
        shell: pwsh
        run: |
          $out = & "build\${{ matrix.preset }}\colorfix_probe_infra.exe" 2>&1
          $code = $LASTEXITCODE
          $out | Write-Output
          Add-Content $env:GITHUB_STEP_SUMMARY "### probe-infra ${{ matrix.preset }}"
          Add-Content $env:GITHUB_STEP_SUMMARY '```text'
          $out | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          $key = $out | Select-String '^(arch|os|winstation|session|dwm composition|dpi|window|summary):' | ForEach-Object { $_.Line }
          Write-Output "::notice title=probe-infra ${{ matrix.preset }}::$(($key -join '%0A'))"
          exit $code
      - name: Probe increment 1 (Phase 1 hooks)
        shell: pwsh
        run: |
          # Two processes: comctl32 v6 cannot be unloaded, so each order needs
          # its own. 2 orders x 5 groups = 10 notices (GitHub's per-step limit).
          $final = 0
          foreach ($order in @('early', 'late')) {
            $out = & "build\${{ matrix.preset }}\colorfix_probe_hooks.exe" "--order=$order" 2>&1
            $code = $LASTEXITCODE
            if ($code -ne 0 -and $final -eq 0) { $final = $code }
            $out | Write-Output
            Add-Content $env:GITHUB_STEP_SUMMARY "### probe-hooks ${{ matrix.preset }} $order"
            Add-Content $env:GITHUB_STEP_SUMMARY '```text'
            $out | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            # Annotations are truncated at about 4 KB: verdict first, then groups.
            $groups = [ordered]@{
              'result'    = '^(arch|order|summary|policy|runtime|buttonface):'
              'autotests' = '^(threshold|expect|autotest|detail):'
              'surfaces'  = '^(surface|scenario):'
              'v6'        = '^((comctl32|v6|v6scenario):|buttontext: (detail|gate-9c|classic|themed|optout)\b)'
              'uxtheme'   = '^((uxtheme|themeoff):|buttontext: (9d|product|infrastructure)\b)'
            }
            foreach ($g in $groups.GetEnumerator()) {
              $lines = $out | Select-String $g.Value | ForEach-Object { $_.Line }
              $notice = "::notice title=probe-hooks ${{ matrix.preset }} $order $($g.Key)::$(($lines -join '%0A'))"
              # Guard, not a gate: measure the exact string handed to ::notice.
              if ($notice.Length -gt 4000) {
                Write-Output "::warning title=notice-length ${{ matrix.preset }} $order $($g.Key)::$($notice.Length) chars > 4000; the annotation may be truncated"
              }
              Write-Output $notice
            }
          }
          exit $final
      - name: Generate Windhawk mod
        run: python windhawk/generate_mod.py
      - name: Windhawk mod syntax check
        shell: cmd
        run: >
          cl /nologo /std:c++20 /Zc:preprocessor /EHsc /Zs /W4 /DUNICODE /D_UNICODE
          /FI"%GITHUB_WORKSPACE%\tests\windhawk\windhawk_api_stub.h"
          generated\colorfix.wh.cpp
